name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Set environment variables from secrets
        run: |
          echo "VITE_AZURE_CLIENT_ID=${{ secrets.VITE_AZURE_CLIENT_ID }}" >> $GITHUB_ENV
          echo "VITE_AZURE_TENANT_ID=${{ secrets.VITE_AZURE_TENANT_ID }}" >> $GITHUB_ENV
          echo "VITE_AZURE_REDIRECT_URL=${{ secrets.VITE_AZURE_REDIRECT_URL }}" >> $GITHUB_ENV
          echo "VITE_AZURE_BACKEND_CLIENT_ID=${{ secrets.VITE_AZURE_BACKEND_CLIENT_ID }}" >> $GITHUB_ENV
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> $GITHUB_ENV
          echo "VITE_COOKIE_SECURE=true" >> $GITHUB_ENV
      - name: Print environment variables
        run: |
          echo "VITE_AZURE_CLIENT_ID=$VITE_AZURE_CLIENT_ID"
          echo "VITE_AZURE_TENANT_ID=$VITE_AZURE_TENANT_ID"
          echo "VITE_AZURE_REDIRECT_URL=$VITE_AZURE_REDIRECT_URL"
          echo "VITE_AZURE_BACKEND_CLIENT_ID=$VITE_AZURE_BACKEND_CLIENT_ID"
          echo "VITE_API_URL=$VITE_API_URL"
          echo "VITE_COOKIE_SECURE=$VITE_COOKIE_SECURE"
      - name: Verify Build Environment
        env:
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_REDIRECT_URL: ${{ secrets.VITE_AZURE_REDIRECT_URL }}
          VITE_AZURE_BACKEND_CLIENT_ID: ${{ secrets.VITE_AZURE_BACKEND_CLIENT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_COOKIE_SECURE: "true"
        run: |
          echo "Environment variables are set (masked for security):"
          [ -n "$VITE_AZURE_CLIENT_ID" ] && echo "✓ VITE_AZURE_CLIENT_ID is set" || echo "✗ VITE_AZURE_CLIENT_ID is NOT set"
          [ -n "$VITE_AZURE_TENANT_ID" ] && echo "✓ VITE_AZURE_TENANT_ID is set" || echo "✗ VITE_AZURE_TENANT_ID is NOT set"
          [ -n "$VITE_AZURE_REDIRECT_URL" ] && echo "✓ VITE_AZURE_REDIRECT_URL is set" || echo "✗ VITE_AZURE_REDIRECT_URL is NOT set"
          [ -n "$VITE_AZURE_BACKEND_CLIENT_ID" ] && echo "✓ VITE_AZURE_BACKEND_CLIENT_ID is set" || echo "✗ VITE_AZURE_BACKEND_CLIENT_ID is NOT set"
          [ -n "$VITE_API_URL" ] && echo "✓ VITE_API_URL is set" || echo "✗ VITE_API_URL is NOT set"
          [ -n "$VITE_COOKIE_SECURE" ] && echo "✓ VITE_COOKIE_SECURE is set" || echo "✗ VITE_COOKIE_SECURE is NOT set"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
           VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
           VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
           VITE_AZURE_REDIRECT_URL: ${{ secrets.VITE_AZURE_REDIRECT_URL }}
           VITE_AZURE_BACKEND_CLIENT_ID: ${{ secrets.VITE_AZURE_BACKEND_CLIENT_ID }}
           VITE_API_URL: ${{ secrets.VITE_API_URL }}
           VITE_COOKIE_SECURE: "true"
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_PLANT_06FEE5D00 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_PLANT_06FEE5D00 }}
          action: "close"
